name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: Last released Git ref for package changeset coverage, defaults to the latest release tag
        required: false
        type: string
permissions:
  # push release tags
  contents: write
  # npm trusted publishing (OIDC): no stored npm token
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check changeset coverage since the last release
        run: |
          base="${INPUT_SINCE:-$(git describe --tags --abbrev=0 --match '@alot-web-develop/design@*')}"
          echo "Release base: $base"
          pnpm release:check --since "$base"
        env:
          INPUT_SINCE: ${{ inputs.since }}
      # Publishes only versions that are not on npm yet; pending changesets wait for a version PR.
      - id: publish
        name: Publish new versions
        run: |
          before="$(git tag --list '@alot-web-develop/*' | wc -l)"
          pnpm release
          after="$(git tag --list '@alot-web-develop/*' | wc -l)"
          if [ "$after" -gt "$before" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi
        env:
          # Provenance only works from CI; local publishes skip it.
          NPM_CONFIG_PROVENANCE: "true"
      - name: Push release tags
        if: steps.publish.outputs.published == 'true'
        run: git push origin --tags
      - name: Install and exercise the published packages
        if: steps.publish.outputs.published == 'true'
        run: pnpm verify:registry
